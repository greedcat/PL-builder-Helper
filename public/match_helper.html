<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Match Helper</title>
<link rel="stylesheet" href="css/match-helper.css">
</head>
<body>

<header>
  <span>📦</span>
  <h1>Match Helper</h1>
</header>

<div class="layout">

  <!-- ── Excel paste ── -->
  <div class="card">
    <h2>1 · Paste Excel Data</h2>
    <textarea id="excel-input" rows="14"
      placeholder="Copy your Excel table (Dest + Value columns) and paste here.&#10;&#10;Example:&#10;Dest	Value&#10;YYZ3	5&#10;YOO1	12&#10;HOLD	3"></textarea>
    <p class="hint">Copy cells from Excel (including header row) and paste with Ctrl+V.</p>
  </div>

  <!-- ── Order list ── -->
  <div class="card">
    <h2>2 · Order List</h2>
    <textarea id="order-input" rows="14"
      placeholder="One destination per line, in the order you want them to appear."></textarea>
    <p class="hint">Edit freely. Destinations are matched case-insensitively.</p>
  </div>

  <!-- ── Buttons ── -->
  <div style="grid-column:1/-1; display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:-8px;">
    <button class="btn-primary" onclick="run()">⚡ Match</button>
    <button class="btn-secondary" onclick="clearAll()">Clear</button>
  </div>

  <!-- ── Results ── -->
  <div class="card" id="results-section">
    <div id="alerts" class="alerts"></div>
    <div class="summary" id="summary"></div>

    <div class="result-views">
      <!-- horizontal -->
      <div>
        <div class="section-header">
          <h2 style="font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#666;">Horizontal (copy-friendly)</h2>
          <button class="copy-btn" id="copy-horiz-btn" onclick="copyHoriz()">Copy</button>
        </div>
        <div class="horiz-wrap" id="horiz-table"></div>
      </div>
    </div>
  </div>

</div>

<script src="js/shared/normalize.js"></script>
<script src="js/shared/clipboard.js"></script>
<script src="js/match-helper.js"></script>
</body>
</html>
